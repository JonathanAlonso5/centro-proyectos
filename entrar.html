<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Entrar al CdP</title><style>body{font:18px system-ui;max-width:360px;margin:60px auto;padding:20px;background:#10171d;color:#fff}button{min-height:44px}#error{color:#ffa9a9}</style></head><body><h1>Centro de Proyectos</h1><p>Entra con tu cuenta de Google para abrir CdP en Friday.</p><div id="google"></div><p id="error"></p><script>
(async function(){
 const target='https://cdp.friday-imperio.com';const state=new URL(location.href).searchParams.get('estado');
 if(location.origin!=='https://centro-proyectos.pages.dev'||!window.opener||!state||!/^[a-f0-9-]{36}$/.test(state)){document.getElementById('error').textContent='Abre esta ventana desde CdP en Friday.';return}
 const send=token=>{window.opener.postMessage({tipo:'cdp-sesion',estado:state,token},target);window.close()};
 const existing=localStorage.getItem('cdp_clave');if(existing){try{const r=await fetch('/api/proyecto/P-001',{headers:{Authorization:'Bearer '+existing}});if(r.ok){send(existing);return}}catch{}}
 window.cdpGoogle=async credential=>{try{const r=await fetch('/api/sesion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credencial:credential})});const b=await r.json();if(!r.ok||!b.token)throw Error(b.error||'No se ha podido entrar');localStorage.setItem('cdp_clave',b.token);send(b.token)}catch(e){document.getElementById('error').textContent=e.message}};
 const cfg=await (await fetch('/api/config')).json();const script=document.createElement('script');script.src='https://accounts.google.com/gsi/client';script.onload=()=>{google.accounts.id.initialize({client_id:cfg.clienteGoogle,callback:r=>cdpGoogle(r.credential)});google.accounts.id.renderButton(document.getElementById('google'),{theme:'outline',size:'large',locale:'es',width:300})};script.onerror=()=>document.getElementById('error').textContent='Google no responde. Cierra esta ventana y usa la clave de acceso.';document.head.appendChild(script);
})().catch(()=>document.getElementById('error').textContent='No se ha podido preparar la entrada.');
</script></body></html>
