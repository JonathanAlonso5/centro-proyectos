<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Centro de Proyectos</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#101318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CdP">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
  /* ============ LUZ ============
     Tres grados en vez de claro/oscuro: "que no deslumbre" y "que se lea con
     cualquier luz" no caben en una sola paleta. Sin negro puro ni blanco puro. */
  :root {
    --ground:#101318; --surface:#161b22; --raised:#1c222b; --sunk:#0d1015;
    --line:#28303a; --line-soft:#1f262e;
    --text:#d5dae0; --text-dim:#a9b2bc; --muted:#7f8996;
    --accent:#c08a4a; --accent-soft:#5c452a;
    --ok:#5f9b6a; --warn:#bd9a2c; --crit:#c05a52;
    --shadow:0 1px 0 rgba(255,255,255,.03), 0 2px 12px rgba(0,0,0,.35);
    --radius:7px;
  }
  :root[data-luz="noche"] {
    --ground:#080a0d; --surface:#0d1014; --raised:#12161b; --sunk:#050709;
    --line:#1d232a; --line-soft:#161b21;
    --text:#b6bcc4; --text-dim:#8e969f; --muted:#6b747e;
    --accent:#a4763f; --accent-soft:#493623;
    --ok:#4f8459; --warn:#9d8125; --crit:#a34a44;
    --shadow:0 2px 14px rgba(0,0,0,.5);
  }
  :root[data-luz="sol"] {
    --ground:#e4e6e3; --surface:#eeefec; --raised:#f4f5f2; --sunk:#dadcd8;
    --line:#c6cac4; --line-soft:#d5d8d3;
    --text:#171b20; --text-dim:#39414a; --muted:#5d6670;
    --accent:#8a5a1e; --accent-soft:#e0d3bf;
    --ok:#2f6b3c; --warn:#7d6410; --crit:#93342c;
    --shadow:0 1px 2px rgba(20,25,30,.08), 0 2px 10px rgba(20,25,30,.06);
  }

  * { box-sizing:border-box; }
  html, body { overflow-x:hidden; }
  body {
    margin:0; background:var(--ground); color:var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric:tabular-nums; }
  button, input, textarea, select { font:inherit; color:inherit; }
  button { background:none; border:none; cursor:pointer; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

  /* ============ ENTRADA ============ */
  .entrada { position:fixed; inset:0; z-index:60; display:grid; place-items:center; background:var(--ground); padding:20px; }
  .entrada-caja { width:min(360px,100%); }
  .entrada h1 { font-size:20px; font-weight:600; margin:0 0 6px; letter-spacing:-.01em; }
  /* Sin esto, el display:grid de .entrada gana al display:none del atributo
     hidden: la pantalla de acceso se queda invisible pero encima de todo,
     tragándose los clics del tablero. */
  .entrada[hidden] { display:none; }
  .entrada p { color:var(--muted); font-size:13.5px; margin:0 0 18px; line-height:1.5; }
  .entrada input {
    width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
    padding:11px 13px; border-radius:var(--radius); margin-bottom:10px;
  }
  .entrada input:focus { border-color:var(--accent); outline:none; }
  .entrada button {
    width:100%; background:var(--accent-soft); border:1px solid var(--accent);
    color:var(--text); padding:10px; border-radius:var(--radius); font-weight:550;
  }
  .entrada .error { color:var(--crit); font-size:13px; min-height:19px; margin-top:8px; }
  .respaldo { margin-top:20px; border-top:1px solid var(--line-soft); padding-top:14px; }
  .respaldo summary { color:var(--muted); font-size:12.5px; cursor:pointer; }
  .respaldo p { font-size:12px; margin:10px 0 8px; }
  #boton-google { min-height:44px; display:flex; justify-content:center; }

  /* ============ BARRA ============ */
  .barra {
    position:sticky; top:0; z-index:30; background:var(--ground);
    border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top);
  }
  .barra-fila { display:flex; align-items:center; gap:14px; padding:9px 14px; max-width:1500px; margin:0 auto; }
  .marca { display:flex; align-items:baseline; gap:8px; flex-shrink:0; }
  .marca b { font-weight:600; font-size:15px; letter-spacing:-.01em; }
  .sincro { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .sincro.guardando { color:var(--accent); }
  .sincro.error { color:var(--crit); }
  .barra-espacio { flex:1; }
  .pestanas { display:flex; gap:2px; background:var(--sunk); padding:3px; border-radius:var(--radius); border:1px solid var(--line-soft); }
  .pestanas button { padding:6px 12px; border-radius:5px; font-size:13px; color:var(--muted); white-space:nowrap; }
  .pestanas button[aria-selected="true"] { background:var(--raised); color:var(--text); box-shadow:var(--shadow); }
  .pestanas .cuenta { font-size:11px; color:var(--accent); margin-left:5px; }
  .luz-grupo { display:flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .luz-grupo button { padding:5px 10px; font-size:12px; color:var(--muted); border-right:1px solid var(--line); }
  .luz-grupo button:last-child { border-right:none; }
  .luz-grupo button[aria-pressed="true"] { background:var(--accent-soft); color:var(--text); }

  /* ============ CAPTURA ============ */
  .captura { border-bottom:1px solid var(--line); background:var(--sunk); }
  .captura-fila { max-width:1500px; margin:0 auto; padding:8px 14px; display:flex; gap:9px; align-items:center; }
  .captura input {
    flex:1; background:var(--surface); border:1px solid var(--line); color:var(--text);
    padding:9px 12px; border-radius:var(--radius); font-size:14px; min-width:0;
  }
  .captura input::placeholder { color:var(--muted); }
  .captura input:focus { border-color:var(--accent); outline:none; }
  .captura button { border:1px solid var(--line); border-radius:var(--radius); padding:9px 14px; color:var(--text-dim); font-size:13.5px; }
  .captura button:hover { border-color:var(--accent); color:var(--text); }

  /* ============ TABLERO ============ */
  main { max-width:1500px; margin:0 auto; padding:14px; }
  .vista[hidden] { display:none; }
  .tablero { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(250px,1fr); gap:12px; align-items:start; }
  .col { background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius); display:flex; flex-direction:column; min-width:0; }
  .col.destino { border-color:var(--accent); background:var(--raised); }
  .col-cab { display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--line-soft); }
  .col-cab h2 { margin:0; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--text-dim); font-weight:600; }
  .col-cab .n { margin-left:auto; font-size:11px; color:var(--muted); }
  .col-punto { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .col-cuerpo { padding:8px; display:flex; flex-direction:column; gap:8px; min-height:20px; }
  .col-pie { padding:0 12px 10px; font-size:11px; color:var(--muted); }
  .col-alta { padding:0 8px 8px; }
  .col-alta input {
    width:100%; background:var(--sunk); border:1px dashed var(--line); color:var(--text);
    padding:7px 10px; border-radius:6px; font-size:13px;
  }
  .col-alta input:focus { border-style:solid; border-color:var(--accent); outline:none; }

  /* ============ TARJETAS ============ */
  .tj { background:var(--raised); border:1px solid var(--line); border-radius:6px; padding:10px 11px; text-align:left; width:100%; display:block; }
  .tj:hover { border-color:var(--accent); }
  .tj.arrastrando { opacity:.4; }
  .tj-sup { display:flex; align-items:center; gap:7px; margin-bottom:5px; }
  .tj-id { font-size:10.5px; color:var(--muted); }
  .tj-t { font-size:14px; font-weight:550; line-height:1.3; margin:0; overflow-wrap:anywhere; }
  .tj-paso { font-size:12px; color:var(--text-dim); margin:7px 0 0; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tj-pie { display:flex; align-items:center; gap:8px; margin-top:9px; font-size:11px; color:var(--muted); flex-wrap:wrap; }
  .barra-prog { height:3px; background:var(--sunk); border-radius:2px; overflow:hidden; margin-top:9px; }
  .barra-prog i { display:block; height:100%; background:var(--accent); }
  .etq { font-size:10.5px; color:var(--muted); border:1px solid var(--line); padding:1.5px 6px; border-radius:20px; }
  .etq.proj { color:var(--accent); border-color:var(--accent-soft); }
  .tj.hecha { opacity:.55; }
  .tj.hecha .tj-t { text-decoration:line-through; text-decoration-color:var(--muted); }
  .mover { margin-left:auto; border:1px solid var(--line); border-radius:5px; padding:3px 8px; font-size:11px; color:var(--muted); }
  .mover:hover { border-color:var(--accent); color:var(--text); }

  .selector-col { display:none; gap:6px; margin-bottom:12px; overflow-x:auto; padding-bottom:2px; }
  .selector-col button { padding:7px 13px; border:1px solid var(--line); border-radius:20px; font-size:13px; color:var(--muted); white-space:nowrap; }
  .selector-col button[aria-pressed="true"] { background:var(--raised); color:var(--text); border-color:var(--accent); }

  /* ============ FILTROS Y BUSCADOR ============ */
  .buscador { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .buscador input {
    flex:1; min-width:200px; background:var(--surface); border:1px solid var(--line);
    color:var(--text); padding:9px 12px; border-radius:var(--radius);
  }
  .buscador input:focus { border-color:var(--accent); outline:none; }
  .filtros { display:flex; gap:5px; flex-wrap:wrap; }
  .filtros button { font-size:12px; padding:6px 11px; border:1px solid var(--line); border-radius:20px; color:var(--muted); }
  .filtros button[aria-pressed="true"] { border-color:var(--accent); color:var(--text); background:var(--accent-soft); }

  /* ============ CEREBRO ============ */
  .notas { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:10px; }
  .nt { background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius); padding:12px 13px; text-align:left; }
  .nt:hover { border-color:var(--accent); }
  .nt-tipo { font-size:10px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; }
  .t-gotcha { color:var(--crit); } .t-feedback { color:var(--warn); }
  .t-reference { color:var(--accent); } .t-project { color:var(--ok); } .t-user { color:var(--text-dim); }
  .nt h3 { margin:6px 0 0; font-size:14.5px; font-weight:550; line-height:1.3; }
  .nt p { margin:6px 0 0; font-size:12.5px; color:var(--text-dim); line-height:1.45;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .nt-pie { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; align-items:center; }

  /* ============ BANDEJA ============ */
  .bandeja { display:flex; flex-direction:column; gap:8px; max-width:840px; }
  .cap { display:flex; gap:11px; align-items:flex-start; background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius); padding:11px 12px; }
  .cap-via { font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:3px 6px; margin-top:1px; width:66px; text-align:center; flex-shrink:0; }
  .cap-cuerpo { flex:1; min-width:0; }
  .cap-cuerpo p { margin:0; font-size:14px; line-height:1.4; overflow-wrap:anywhere; }
  .cap-meta { font-size:11px; color:var(--muted); margin-top:5px; }
  .cap-acc { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; }
  .cap-acc button, .cap-acc select { font-size:11.5px; border:1px solid var(--line); border-radius:5px; padding:5px 9px; color:var(--text-dim); background:var(--surface); }
  .cap-acc button:hover { border-color:var(--accent); color:var(--text); }

  /* ============ PANEL ============ */
  .velo { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40; }
  .velo[hidden], .panel[hidden] { display:none; }
  .panel {
    position:fixed; top:0; right:0; bottom:0; width:min(470px,100%); z-index:41;
    background:var(--surface); border-left:1px solid var(--line); overflow-y:auto;
    padding:calc(16px + env(safe-area-inset-top)) 18px 60px;
  }
  .panel-cab { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .panel .cerrar { margin-left:auto; font-size:22px; color:var(--muted); line-height:1; padding:2px 6px; }
  .panel h2 { margin:8px 0 0; font-size:19px; font-weight:600; line-height:1.25; }
  .panel h2[contenteditable]:focus { outline:none; border-bottom:1px solid var(--accent); }
  .campo { display:grid; grid-template-columns:96px 1fr; gap:8px; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:13px; align-items:center; }
  .campo dt { color:var(--muted); font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; }
  .campo dd { margin:0; min-width:0; }
  .campo input, .campo select, .campo textarea {
    width:100%; background:var(--sunk); border:1px solid var(--line); color:var(--text);
    padding:6px 9px; border-radius:5px; font-size:13px;
  }
  .campo input:focus, .campo select:focus, .campo textarea:focus { border-color:var(--accent); outline:none; }
  .campo textarea { resize:vertical; min-height:70px; line-height:1.45; }
  .contador { font-size:11px; color:var(--muted); text-align:right; margin-top:3px; }
  .contador.pasado { color:var(--crit); }
  .panel-sec { margin-top:22px; }
  .panel-sec h3 { font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .panel-sec h3 span { margin-left:auto; text-transform:none; letter-spacing:0; }
  .fila { display:flex; gap:8px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--line-soft); font-size:13px; }
  .fila-tipo { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; width:80px; flex-shrink:0; }
  .fila a, .fila button.enlace { color:var(--accent); text-decoration:none; text-align:left; padding:0; }
  .fila a:hover, .fila button.enlace:hover { text-decoration:underline; }
  .panel-cuerpo { margin-top:14px; font-size:13.5px; color:var(--text-dim); line-height:1.55; white-space:pre-wrap; }
  .peligro { margin-top:26px; font-size:12px; color:var(--muted); }
  .peligro button { color:var(--crit); border:1px solid var(--line); border-radius:5px; padding:6px 11px; font-size:12px; }

  /* ============ MENÚ MOVER ============ */
  .menu { position:fixed; z-index:50; background:var(--raised); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:5px; min-width:170px; }
  .menu[hidden] { display:none; }
  .menu button { display:block; width:100%; text-align:left; padding:9px 12px; border-radius:5px; font-size:13.5px; color:var(--text-dim); }
  .menu button:hover { background:var(--accent-soft); color:var(--text); }

  /* ============ AVISO ============ */
  .aviso {
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom));
    background:var(--raised); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 16px; font-size:13.5px; z-index:70; box-shadow:var(--shadow); max-width:90vw;
  }
  .aviso[hidden] { display:none; }
  .aviso.mal { border-color:var(--crit); color:var(--crit); }

  .vacio { color:var(--muted); font-size:13.5px; padding:10px 2px; }

  @media (max-width:820px) {
    .barra-fila { flex-wrap:wrap; gap:10px; }
    .barra-espacio { display:none; }
    /* Rejilla de cuatro en vez de fila con scroll: una barra de pestañas que
       se arrastra de lado es un scroll dentro de una página que ya baja. */
    .pestanas { order:3; width:100%; display:grid; grid-template-columns:repeat(4,1fr); }
    .pestanas button { padding:7px 3px; font-size:12.5px; text-align:center; }
    .pestanas .cuenta { margin-left:3px; }
    .tablero { grid-auto-flow:row; grid-auto-columns:auto; }
    .col { display:none; }
    .col.activa { display:flex; }
    .selector-col { display:flex; }
    main { padding:12px; }
    .cap { flex-wrap:wrap; }
    .cap-acc { width:100%; justify-content:flex-start; }
    .campo { grid-template-columns:1fr; gap:4px; }
  }
</style>
</head>
<body>

<div class="entrada" id="entrada" hidden>
  <div class="entrada-caja">
    <h1>Centro de Proyectos</h1>
    <p>Entra con tu cuenta de Google. La sesión dura un mes en este dispositivo.</p>
    <div id="boton-google"></div>
    <div class="error" id="entrada-error"></div>
    <details class="respaldo">
      <summary>Entrar con la clave larga</summary>
      <p>Solo si Google no va. Es la misma clave que usan el bot y los scripts.</p>
      <input type="password" id="clave" placeholder="Clave" autocomplete="current-password">
      <button id="entrar">Entrar con la clave</button>
    </details>
  </div>
</div>

<div id="app" hidden>
  <div class="barra">
    <div class="barra-fila">
      <div class="marca"><b>Centro de Proyectos</b><span class="sincro" id="sincro">al día</span></div>
      <div class="pestanas" role="tablist">
        <button role="tab" data-vista="proyectos" aria-selected="true">Proyectos <span class="cuenta" id="c-proyectos"></span></button>
        <button role="tab" data-vista="tareas" aria-selected="false">Tareas <span class="cuenta" id="c-tareas"></span></button>
        <button role="tab" data-vista="cerebro" aria-selected="false">Cerebro <span class="cuenta" id="c-cerebro"></span></button>
        <button role="tab" data-vista="bandeja" aria-selected="false">Bandeja <span class="cuenta" id="c-bandeja"></span></button>
      </div>
      <div class="barra-espacio"></div>
      <div class="luz-grupo" id="luces">
        <button data-luz="noche" aria-pressed="false">Noche</button>
        <button data-luz="interior" aria-pressed="true">Interior</button>
        <button data-luz="sol" aria-pressed="false">Sol</button>
      </div>
    </div>
  </div>

  <div class="captura">
    <div class="captura-fila">
      <input id="captura" type="text" placeholder="Suelta aquí lo que sea. Ya lo clasificas luego." autocomplete="off" enterkeyhint="done">
      <button id="btn-captura">Capturar</button>
    </div>
  </div>

  <main>
    <section class="vista" id="v-proyectos">
      <div class="selector-col" id="sel-proyectos"></div>
      <div class="tablero" id="tab-proyectos"></div>
    </section>

    <section class="vista" id="v-tareas" hidden>
      <div class="buscador">
        <div class="filtros" id="filtros-tareas">
          <button data-f="todas" aria-pressed="true">Todas</button>
          <button data-f="mias" aria-pressed="false">Solo mías</button>
        </div>
      </div>
      <div class="selector-col" id="sel-tareas"></div>
      <div class="tablero" id="tab-tareas"></div>
    </section>

    <section class="vista" id="v-cerebro" hidden>
      <div class="buscador">
        <input id="buscar" type="text" placeholder="Buscar en el cerebro..." autocomplete="off" enterkeyhint="search">
        <div class="filtros" id="filtros-notas">
          <button data-t="todo" aria-pressed="true">Todo</button>
          <button data-t="gotcha" aria-pressed="false">Gotchas</button>
          <button data-t="feedback" aria-pressed="false">Cómo trabajar</button>
          <button data-t="reference" aria-pressed="false">Referencias</button>
          <button data-t="project" aria-pressed="false">Proyecto</button>
        </div>
      </div>
      <div class="notas" id="lista-notas"></div>
    </section>

    <section class="vista" id="v-bandeja" hidden>
      <div class="bandeja" id="lista-bandeja"></div>
    </section>
  </main>
</div>

<div class="velo" id="velo" hidden></div>
<aside class="panel" id="panel" hidden aria-label="Detalle"></aside>
<div class="menu" id="menu" hidden></div>
<div class="aviso" id="aviso" hidden></div>

<script src="/pwa-init.js" defer></script>
<script>
(function () {
  "use strict";

  // ---------- estado ----------
  var datos = { proyectos: [], tareas: [], capturas: [], contadores: {} };
  var notas = [];
  var vista = "proyectos";
  var filtroTareas = "todas";
  var filtroNota = "todo";
  var colActiva = {};

  var COLS_PROYECTO = [
    { k: "activo", t: "Activo", c: "var(--ok)" },
    { k: "desarrollo", t: "En desarrollo", c: "var(--accent)" },
    { k: "planificacion", t: "Planificación", c: "var(--warn)" },
    { k: "pausado", t: "Pausado", c: "var(--muted)" },
    { k: "completado", t: "Completado", c: "var(--line)" }
  ];
  var COLS_TAREA = [
    { k: "porHacer", t: "Por hacer", c: "var(--muted)" },
    { k: "enCurso", t: "En curso", c: "var(--accent)" },
    { k: "hecho", t: "Hecho", c: "var(--ok)" }
  ];
  var SUBTIPOS = { gotcha: "Gotcha", feedback: "Cómo trabajar", reference: "Referencia", project: "Proyecto", user: "Sobre mí" };
  var TOPE_PASO = 280;

  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  // ---------- red ----------
  var clave = function () { return localStorage.getItem("cdp_clave") || ""; };

  function sincro(texto, clase) {
    var el = $("#sincro");
    el.textContent = texto;
    el.className = "sincro" + (clase ? " " + clase : "");
  }

  function avisar(texto, mal) {
    var el = $("#aviso");
    el.textContent = texto;
    el.className = "aviso" + (mal ? " mal" : "");
    el.hidden = false;
    clearTimeout(avisar.t);
    avisar.t = setTimeout(function () { el.hidden = true; }, mal ? 6000 : 2600);
  }

  async function api(ruta, cuerpo) {
    var opciones = {
      method: cuerpo ? "POST" : "GET",
      headers: { Authorization: "Bearer " + clave(), "Content-Type": "application/json" },
      cache: "no-store"
    };
    if (cuerpo) opciones.body = JSON.stringify(cuerpo);
    var res = await fetch("/api/" + ruta, opciones);
    if (res.status === 401) {
      localStorage.removeItem("cdp_clave");
      mostrarEntrada("La clave ya no vale.");
      throw new Error("clave");
    }
    var json = await res.json();
    if (!res.ok || json.error) throw new Error(json.error || "HTTP " + res.status);
    return json;
  }

  // Guardar es lo único que puede perder trabajo, así que se ve siempre en qué
  // estado está y los fallos no se tragan en silencio.
  async function guardar(ruta, cuerpo, alVuelo) {
    sincro("guardando", "guardando");
    try {
      var r = await api(ruta, cuerpo);
      sincro("al día");
      if (alVuelo) alVuelo(r);
      return r;
    } catch (e) {
      sincro("sin guardar", "error");
      avisar("No se ha podido guardar: " + e.message, true);
      await cargar();
      throw e;
    }
  }

  async function cargar() {
    datos = await api("estado");
    $("#c-proyectos").textContent = datos.proyectos.length;
    $("#c-tareas").textContent = datos.tareas.filter(function (t) { return t.estado !== "hecho"; }).length;
    $("#c-cerebro").textContent = datos.contadores.notas || 0;
    $("#c-bandeja").textContent = datos.capturas.length || "";
    pintar();
  }

  // ---------- luz ----------
  var raiz = document.documentElement;
  function fijarLuz(luz) {
    raiz.setAttribute("data-luz", luz);
    localStorage.setItem("cdp_luz", luz);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", luz === "sol" ? "#e4e6e3" : luz === "noche" ? "#080a0d" : "#101318");
    Array.prototype.forEach.call(document.querySelectorAll("#luces button"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.luz === luz));
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll("#luces button"), function (b) {
    b.addEventListener("click", function () { fijarLuz(b.dataset.luz); });
  });

  // ---------- pintado ----------
  function pintar() {
    if (vista === "proyectos") pintarProyectos();
    if (vista === "tareas") pintarTareas();
    if (vista === "cerebro") pintarNotas();
    if (vista === "bandeja") pintarBandeja();
  }

  function tablero(destino, selector, cols, items, pintaTarjeta, pie) {
    var cont = $(destino), sel = $(selector);
    cont.innerHTML = "";
    sel.innerHTML = "";
    if (!colActiva[destino]) colActiva[destino] = cols[0].k;

    cols.forEach(function (c) {
      var lista = items.filter(function (x) { return (x.estado || cols[0].k) === c.k; });
      var col = document.createElement("div");
      col.className = "col" + (colActiva[destino] === c.k ? " activa" : "");
      col.dataset.col = c.k;
      col.innerHTML =
        '<div class="col-cab"><span class="col-punto" style="background:' + c.c + '"></span>' +
        "<h2>" + esc(c.t) + '</h2><span class="n mono">' + lista.length + "</span></div>" +
        '<div class="col-cuerpo">' + (lista.map(pintaTarjeta).join("") || '<div class="vacio">Nada aquí.</div>') + "</div>" +
        (pie && pie(c) ? '<div class="col-pie">' + pie(c) + "</div>" : "");
      cont.appendChild(col);
      zonaDeSoltar(col, c.k);

      var chip = document.createElement("button");
      chip.setAttribute("aria-pressed", String(colActiva[destino] === c.k));
      chip.textContent = c.t + " · " + lista.length;
      chip.addEventListener("click", function () {
        colActiva[destino] = c.k;
        Array.prototype.forEach.call(cont.children, function (o) {
          o.classList.toggle("activa", o.dataset.col === c.k);
        });
        Array.prototype.forEach.call(sel.children, function (o) {
          o.setAttribute("aria-pressed", String(o === chip));
        });
      });
      sel.appendChild(chip);
    });
  }

  function pintarProyectos() {
    tablero("#tab-proyectos", "#sel-proyectos", COLS_PROYECTO, datos.proyectos, function (p) {
      var c = p.conteos || {};
      return (
        '<article class="tj" draggable="true" data-nodo="' + p.id + '" data-estado="' + p.estado + '">' +
        '<div class="tj-sup"><span class="tj-id mono">' + p.id + "</span>" +
        '<span class="tj-id mono" style="margin-left:auto">' + p.progreso + "%</span></div>" +
        '<p class="tj-t">' + esc(p.titulo) + "</p>" +
        '<div class="barra-prog"><i style="width:' + p.progreso + '%"></i></div>' +
        (p.proximoPaso ? '<p class="tj-paso">' + esc(p.proximoPaso) + "</p>" : "") +
        '<div class="tj-pie"><span class="mono">' + (c.porHacer || 0) + " por hacer</span>" +
        (c.enCurso ? '<span class="mono" style="color:var(--accent)">' + c.enCurso + " en curso</span>" : "") +
        '<button class="mover" data-mover="' + p.id + '">Mover</button></div>' +
        "</article>"
      );
    });
  }

  function pintarTareas() {
    var lista = datos.tareas.filter(function (t) {
      return filtroTareas === "mias" ? t.agente === "jonathan" || !t.agente : true;
    });
    tablero(
      "#tab-tareas",
      "#sel-tareas",
      COLS_TAREA,
      lista,
      function (t) {
        return (
          '<article class="tj' + (t.estado === "hecho" ? " hecha" : "") + '" draggable="true" data-nodo="' + t.id + '" data-estado="' + t.estado + '">' +
          '<div class="tj-sup">' + (t.proyecto ? '<span class="etq proj">' + t.proyecto + "</span>" : "") + "</div>" +
          '<p class="tj-t">' + esc(t.titulo) + "</p>" +
          '<div class="tj-pie"><button class="mover" data-mover="' + t.id + '">Mover</button></div>' +
          "</article>"
        );
      },
      function (c) {
        return c.k === "hecho" && datos.contadores.hechasOcultas
          ? "y " + datos.contadores.hechasOcultas + " más, archivadas. Se buscan desde el Cerebro."
          : "";
      }
    );
  }

  function pintarNotas() {
    var lista = notas.filter(function (n) {
      return filtroNota === "todo" || (n.extra && n.extra.subtipo) === filtroNota;
    });
    $("#lista-notas").innerHTML =
      lista
        .map(function (n) {
          var sub = (n.extra && n.extra.subtipo) || "project";
          var desc = (n.extra && n.extra.descripcion) || n.cuerpo || "";
          return (
            '<article class="nt" data-nodo="' + n.id + '">' +
            '<span class="nt-tipo t-' + sub + '">' + esc(SUBTIPOS[sub] || sub) + "</span>" +
            "<h3>" + esc(n.titulo) + "</h3><p>" + esc(desc) + "</p>" +
            '<div class="nt-pie">' +
            (n.proyecto ? '<span class="etq proj">' + n.proyecto + "</span>" : '<span class="etq">transversal</span>') +
            (n.etiquetas || []).map(function (e) { return '<span class="etq">' + esc(e) + "</span>"; }).join("") +
            "</div></article>"
          );
        })
        .join("") || '<p class="vacio">Nada por aquí todavía.</p>';
  }

  function pintarBandeja() {
    var opciones = datos.proyectos
      .map(function (p) { return '<option value="' + p.id + '">' + p.id + " " + esc(p.titulo) + "</option>"; })
      .join("");
    $("#lista-bandeja").innerHTML =
      datos.capturas
        .map(function (c) {
          var via = (c.extra && c.extra.via) || "pwa";
          return (
            '<div class="cap" data-cap="' + c.id + '">' +
            '<span class="cap-via">' + esc(via) + "</span>" +
            '<div class="cap-cuerpo"><p>' + esc(c.titulo) + "</p>" +
            '<div class="cap-meta mono">' + c.id + " · " + fecha(c.modificado) + "</div></div>" +
            '<div class="cap-acc">' +
            '<select data-destino="' + c.id + '"><option value="">Sin proyecto</option>' + opciones + "</select>" +
            '<button data-clasificar="tarea">Tarea</button>' +
            '<button data-clasificar="nota">Nota</button>' +
            '<button data-clasificar="descartar">Descartar</button>' +
            "</div></div>"
          );
        })
        .join("") || '<p class="vacio">Bandeja vacía. Suelta algo arriba.</p>';
  }

  function fecha(iso) {
    if (!iso) return "";
    var d = new Date(iso), hoy = new Date();
    var mismoDia = d.toDateString() === hoy.toDateString();
    return mismoDia
      ? "hoy " + d.toTimeString().slice(0, 5)
      : d.toISOString().slice(0, 10);
  }

  // ---------- mover: arrastrar en escritorio, menú con el dedo ----------
  var arrastrado = null;

  document.addEventListener("dragstart", function (e) {
    var tj = e.target.closest && e.target.closest(".tj");
    if (!tj) return;
    arrastrado = tj;
    tj.classList.add("arrastrando");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", tj.dataset.nodo);
  });
  document.addEventListener("dragend", function () {
    if (arrastrado) arrastrado.classList.remove("arrastrando");
    arrastrado = null;
    Array.prototype.forEach.call(document.querySelectorAll(".col"), function (c) {
      c.classList.remove("destino");
    });
  });

  function zonaDeSoltar(col, estado) {
    col.addEventListener("dragover", function (e) {
      if (!arrastrado) return;
      e.preventDefault();
      col.classList.add("destino");
    });
    col.addEventListener("dragleave", function () { col.classList.remove("destino"); });
    col.addEventListener("drop", async function (e) {
      e.preventDefault();
      col.classList.remove("destino");
      if (!arrastrado) return;
      var id = arrastrado.dataset.nodo;
      var vecinas = vecinasEn(col, e.clientY);
      await mover(id, estado, vecinas.antes, vecinas.despues);
    });
  }

  // Entre qué dos tarjetas se ha soltado: el orden nuevo es el punto medio.
  function vecinasEn(col, y) {
    var cuerpo = col.querySelector(".col-cuerpo");
    var tarjetas = Array.prototype.slice.call(cuerpo.querySelectorAll(".tj")).filter(function (t) {
      return t !== arrastrado;
    });
    var antes = null, despues = null;
    for (var i = 0; i < tarjetas.length; i++) {
      var caja = tarjetas[i].getBoundingClientRect();
      if (y > caja.top + caja.height / 2) antes = tarjetas[i].dataset.nodo;
      else { despues = tarjetas[i].dataset.nodo; break; }
    }
    return { antes: antes, despues: despues };
  }

  async function mover(id, estado, antes, despues) {
    await guardar("mover", { id: id, estado: estado, antes: antes, despues: despues });
    await cargar();
  }

  // Menú "Mover": con el dedo, arrastrar dentro de una lista que además baja
  // falla más de lo que acierta.
  document.addEventListener("click", function (e) {
    var boton = e.target.closest("[data-mover]");
    if (!boton) return;
    e.stopPropagation();
    var id = boton.dataset.mover;
    var esProyecto = /^P-\d{3}$/.test(id);
    var cols = esProyecto ? COLS_PROYECTO : COLS_TAREA;
    var actual = boton.closest(".tj").dataset.estado;
    var menu = $("#menu");
    menu.innerHTML = cols
      .filter(function (c) { return c.k !== actual; })
      .map(function (c) { return '<button data-a="' + c.k + '">Mover a ' + esc(c.t) + "</button>"; })
      .join("");
    var caja = boton.getBoundingClientRect();
    menu.hidden = false;
    menu.style.top = Math.min(caja.bottom + 6, window.innerHeight - menu.offsetHeight - 10) + "px";
    menu.style.left = Math.min(caja.left, window.innerWidth - menu.offsetWidth - 10) + "px";
    menu.onclick = async function (ev) {
      var b = ev.target.closest("[data-a]");
      if (!b) return;
      menu.hidden = true;
      await mover(id, b.dataset.a, null, null);
    };
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest("#menu") && !e.target.closest("[data-mover]")) $("#menu").hidden = true;
  });

  // ---------- panel de detalle ----------
  async function abrir(id) {
    var panel = $("#panel");
    panel.innerHTML = '<p class="vacio">Cargando...</p>';
    panel.hidden = false;
    $("#velo").hidden = false;

    var esProyecto = /^P-\d{3}$/.test(id);
    panel.innerHTML = esProyecto ? await fichaProyecto(id) : await fichaNodo(id);
    enganchesDelPanel(panel, id);
  }

  function cerrar() {
    $("#panel").hidden = true;
    $("#velo").hidden = true;
  }

  async function fichaProyecto(id) {
    var f = await api("proyecto/" + id);
    var p = f.proyecto;
    var paso = String(p.extra.proximoPaso || "");
    return (
      cabecera(p, "proyecto") +
      '<h2 contenteditable="plaintext-only" data-campo="titulo">' + esc(p.titulo) + "</h2>" +
      "<dl>" +
      campoSelect("Estado", "estado", p.estado, COLS_PROYECTO.map(function (c) { return [c.k, c.t]; })) +
      campo("Progreso", '<input type="number" min="0" max="100" data-extra="progreso" value="' + (p.extra.progreso || 0) + '">') +
      campo("Etiquetas", '<input type="text" data-etiquetas value="' + esc((p.etiquetas || []).join(", ")) + '" placeholder="separadas por comas">') +
      "</dl>" +
      '<div class="panel-sec"><h3>Próximo paso</h3>' +
      '<textarea data-extra="proximoPaso" maxlength="' + TOPE_PASO + '" rows="3">' + esc(paso) + "</textarea>" +
      '<div class="contador' + (paso.length > TOPE_PASO ? " pasado" : "") + '" id="contador-paso">' +
      paso.length + " / " + TOPE_PASO + " · lo demás va a tareas, notas y sesiones</div></div>" +
      seccionTareas(f.tareas) +
      seccionLista("Sesiones", f.sesiones, function (s) {
        return '<span class="fila-tipo mono">' + esc((s.extra && s.extra.fecha) || "") + "</span><span>" + esc(s.cuerpo || s.titulo) + "</span>";
      }) +
      seccionLista("Notas", f.notas, function (n) {
        return '<span class="fila-tipo">' + esc(((n.extra && n.extra.subtipo) || "nota")) + '</span><button class="enlace" data-nodo="' + n.id + '">' + esc(n.titulo) + "</button>";
      }) +
      seccionEnlaces(f.enlaces) +
      '<div class="peligro"><button data-borrar="' + p.id + '">Borrar el proyecto entero</button></div>'
    );
  }

  async function fichaNodo(id) {
    var n = await api("nodo/" + id);
    var sub = (n.extra && n.extra.subtipo) || "";
    return (
      cabecera(n, n.tipo) +
      '<h2 contenteditable="plaintext-only" data-campo="titulo">' + esc(n.titulo) + "</h2>" +
      "<dl>" +
      (n.tipo === "tarea"
        ? campoSelect("Estado", "estado", n.estado, COLS_TAREA.map(function (c) { return [c.k, c.t]; }))
        : "") +
      (n.tipo === "nota"
        ? campoSelect("Tipo", "extra:subtipo", sub, Object.keys(SUBTIPOS).map(function (k) { return [k, SUBTIPOS[k]]; }))
        : "") +
      campo("Proyecto", selectProyecto(n.proyecto)) +
      campo("Quién", selectAgente(n.agente)) +
      campo("Etiquetas", '<input type="text" data-etiquetas value="' + esc((n.etiquetas || []).join(", ")) + '">') +
      "</dl>" +
      '<div class="panel-sec"><h3>Contenido</h3>' +
      '<textarea data-campo="cuerpo" rows="9">' + esc(n.cuerpo || "") + "</textarea></div>" +
      seccionEnlaces(n.enlaces) +
      '<div class="peligro"><button data-borrar="' + n.id + '">Borrar</button></div>'
    );
  }

  function cabecera(n, tipo) {
    return (
      '<div class="panel-cab"><span class="etq mono">' + n.id + '</span><span class="etq">' + esc(tipo) + "</span>" +
      (n.proyecto ? '<span class="etq proj">' + n.proyecto + "</span>" : "") +
      '<button class="cerrar" aria-label="Cerrar">&times;</button></div>'
    );
  }
  function campo(nombre, html) {
    return '<div class="campo"><dt>' + esc(nombre) + "</dt><dd>" + html + "</dd></div>";
  }
  function campoSelect(nombre, campoId, valor, opciones) {
    return campo(
      nombre,
      '<select data-campo="' + campoId + '">' +
        opciones.map(function (o) {
          return '<option value="' + o[0] + '"' + (o[0] === valor ? " selected" : "") + ">" + esc(o[1]) + "</option>";
        }).join("") +
        "</select>"
    );
  }
  function selectProyecto(actual) {
    return (
      '<select data-campo="proyecto"><option value="">Transversal</option>' +
      datos.proyectos.map(function (p) {
        return '<option value="' + p.id + '"' + (p.id === actual ? " selected" : "") + ">" + p.id + " " + esc(p.titulo) + "</option>";
      }).join("") +
      "</select>"
    );
  }
  function selectAgente(actual) {
    var quienes = [["", "Sin asignar"], ["jonathan", "Jonathan"], ["claude-code", "Claude Code"], ["codex", "Codex"]];
    return (
      '<select data-campo="agente">' +
      quienes.map(function (q) {
        return '<option value="' + q[0] + '"' + (q[0] === (actual || "") ? " selected" : "") + ">" + q[1] + "</option>";
      }).join("") +
      "</select>"
    );
  }

  function seccionTareas(tareas) {
    var vivas = tareas.filter(function (t) { return t.estado !== "hecho"; });
    var hechas = tareas.length - vivas.length;
    return (
      '<div class="panel-sec"><h3>Tareas <span>' + hechas + " hechas</span></h3>" +
      (vivas
        .map(function (t) {
          return '<div class="fila"><span class="fila-tipo">' + esc(t.estado) + '</span><button class="enlace" data-nodo="' + t.id + '">' + esc(t.titulo) + "</button></div>";
        })
        .join("") || '<p class="vacio">Ninguna pendiente.</p>') +
      "</div>"
    );
  }

  function seccionLista(titulo, lista, pinta) {
    if (!lista || !lista.length) return "";
    return (
      '<div class="panel-sec"><h3>' + esc(titulo) + " <span>" + lista.length + "</span></h3>" +
      lista.slice(0, 25).map(function (x) { return '<div class="fila">' + pinta(x) + "</div>"; }).join("") +
      "</div>"
    );
  }

  function seccionEnlaces(enlaces) {
    if (!enlaces) return "";
    var salen = enlaces.salen || [], entran = enlaces.entran || [];
    if (!salen.length && !entran.length) return "";
    var fila = function (e) {
      return '<div class="fila"><span class="fila-tipo">' + esc(e.tipo) + '</span><button class="enlace" data-nodo="' + e.id + '">' + esc(e.titulo) + "</button></div>";
    };
    return (
      (salen.length ? '<div class="panel-sec"><h3>Enlaza con</h3>' + salen.map(fila).join("") + "</div>" : "") +
      (entran.length ? '<div class="panel-sec"><h3>Le apuntan</h3>' + entran.map(fila).join("") + "</div>" : "")
    );
  }

  // Guardado al salir del campo: no hay botón de guardar y no hace falta.
  function enganchesDelPanel(panel, id) {
    var cerrarBtn = panel.querySelector(".cerrar");
    if (cerrarBtn) cerrarBtn.addEventListener("click", cerrar);

    var recoger = function (el) {
      var cuerpo = { id: id };
      var campo = el.dataset.campo;
      if (el.hasAttribute("data-etiquetas")) {
        cuerpo.etiquetas = el.value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
      } else if (el.dataset.extra) {
        var extra = {};
        extra[el.dataset.extra] = el.type === "number" ? Number(el.value) : el.value;
        cuerpo.extra = extra;
      } else if (campo && campo.indexOf("extra:") === 0) {
        var e2 = {};
        e2[campo.slice(6)] = el.value;
        cuerpo.extra = e2;
      } else if (campo) {
        cuerpo[campo] = el.tagName === "H2" ? el.textContent.trim() : el.value;
      } else {
        return null;
      }
      return cuerpo;
    };

    Array.prototype.forEach.call(panel.querySelectorAll("[data-campo],[data-extra],[data-etiquetas]"), function (el) {
      var evento = el.tagName === "SELECT" ? "change" : "blur";
      el.addEventListener(evento, async function () {
        var cuerpo = recoger(el);
        if (!cuerpo) return;
        await guardar("nodo", cuerpo);
        await cargar();
      });
      if (el.dataset.extra === "proximoPaso") {
        el.addEventListener("input", function () {
          var c = panel.querySelector("#contador-paso");
          if (c) {
            c.textContent = el.value.length + " / " + TOPE_PASO + " · lo demás va a tareas, notas y sesiones";
            c.classList.toggle("pasado", el.value.length >= TOPE_PASO);
          }
        });
      }
    });

    var borrar = panel.querySelector("[data-borrar]");
    if (borrar) {
      borrar.addEventListener("click", async function () {
        if (!confirm("¿Borrar " + borrar.dataset.borrar + "? No hay vuelta atrás.")) return;
        await guardar("borrar", { id: borrar.dataset.borrar });
        cerrar();
        await cargar();
      });
    }
  }

  // ---------- eventos generales ----------
  document.addEventListener("click", function (e) {
    if (e.target.closest("[data-mover]") || e.target.closest("#menu")) return;
    var d = e.target.closest("[data-nodo]");
    if (!d) return;
    e.preventDefault();
    abrir(d.dataset.nodo);
  });
  $("#velo").addEventListener("click", cerrar);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { cerrar(); $("#menu").hidden = true; }
  });

  Array.prototype.forEach.call(document.querySelectorAll(".pestanas button"), function (b) {
    b.addEventListener("click", async function () {
      vista = b.dataset.vista;
      Array.prototype.forEach.call(document.querySelectorAll(".pestanas button"), function (o) {
        o.setAttribute("aria-selected", String(o === b));
      });
      ["proyectos", "tareas", "cerebro", "bandeja"].forEach(function (v) {
        $("#v-" + v).hidden = v !== vista;
      });
      if (vista === "cerebro" && !notas.length) {
        notas = await api("notas");
      }
      pintar();
      window.scrollTo(0, 0);
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll("#filtros-tareas button"), function (b) {
    b.addEventListener("click", function () {
      filtroTareas = b.dataset.f;
      Array.prototype.forEach.call(document.querySelectorAll("#filtros-tareas button"), function (o) {
        o.setAttribute("aria-pressed", String(o === b));
      });
      pintarTareas();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("#filtros-notas button"), function (b) {
    b.addEventListener("click", function () {
      filtroNota = b.dataset.t;
      Array.prototype.forEach.call(document.querySelectorAll("#filtros-notas button"), function (o) {
        o.setAttribute("aria-pressed", String(o === b));
      });
      pintarNotas();
    });
  });

  var temporizadorBusca;
  $("#buscar").addEventListener("input", function (e) {
    clearTimeout(temporizadorBusca);
    var q = e.target.value.trim();
    temporizadorBusca = setTimeout(async function () {
      notas = q ? await api("buscar?q=" + encodeURIComponent(q) + "&limite=60") : await api("notas");
      pintarNotas();
    }, 220);
  });

  async function capturar() {
    var campo = $("#captura");
    var texto = campo.value.trim();
    if (!texto) return;
    campo.value = "";
    var r = await guardar("capturar", { texto: texto, via: "pwa" });
    avisar(r.sugerencia ? "Capturado. Sugiere " + r.sugerencia : "Capturado.");
    await cargar();
  }
  $("#captura").addEventListener("keydown", function (e) { if (e.key === "Enter") capturar(); });
  $("#btn-captura").addEventListener("click", capturar);

  $("#lista-bandeja").addEventListener("click", async function (e) {
    var b = e.target.closest("[data-clasificar]");
    if (!b) return;
    var caja = b.closest("[data-cap]");
    var proyecto = caja.querySelector("select").value;
    await guardar("clasificar", {
      id: caja.dataset.cap,
      destino: b.dataset.clasificar,
      proyecto: proyecto,
      subtipo: "project"
    });
    await cargar();
    if (b.dataset.clasificar !== "descartar") notas = [];
  });

  // ---------- entrada ----------
  var googlePreparado = false;
  function mostrarEntrada(error) {
    $("#entrada").hidden = false;
    $("#app").hidden = true;
    $("#entrada-error").textContent = error || "";
    // Si la sesión caduca estando dentro, hay que volver a pintar el botón:
    // sin esto la pantalla de entrada saldría solo con la clave larga.
    if (!googlePreparado) { googlePreparado = true; prepararGoogle(); }
  }

  async function entrar(valor) {
    localStorage.setItem("cdp_clave", valor);
    try {
      await cargar();
      $("#entrada").hidden = true;
      $("#app").hidden = false;
      compartido();
    } catch (e) {
      if (e.message !== "clave") mostrarEntrada("No se ha podido entrar: " + e.message);
    }
  }
  $("#entrar").addEventListener("click", function () { entrar($("#clave").value.trim()); });
  $("#clave").addEventListener("keydown", function (e) {
    if (e.key === "Enter") entrar($("#clave").value.trim());
  });

  // Entrar con Google. Lo que se guarda NO es el token de Google: es una sesión
  // propia de un mes, firmada por el servidor. Así rotar la clave del CdP echa
  // a todo el mundo de golpe y el token de Google no vive en el navegador.
  async function entrarConGoogle(credencial) {
    $("#entrada-error").textContent = "";
    try {
      var res = await fetch("/api/sesion", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ credencial: credencial })
      });
      var datos = await res.json();
      if (!res.ok) throw new Error(datos.error || "no se ha podido entrar");
      entrar(datos.token);
    } catch (e) {
      mostrarEntrada(e.message);
    }
  }

  function prepararGoogle() {
    var pintar = function () {
      if (!window.google || !google.accounts || !google.accounts.id) return;
      fetch("/api/config")
        .then(function (r) { return r.json(); })
        .then(function (cfg) {
          google.accounts.id.initialize({
            client_id: cfg.clienteGoogle,
            callback: function (r) { entrarConGoogle(r.credential); }
          });
          google.accounts.id.renderButton($("#boton-google"), {
            theme: raiz.getAttribute("data-luz") === "sol" ? "outline" : "filled_black",
            size: "large",
            text: "continue_with",
            locale: "es",
            width: 300
          });
        })
        .catch(function () {
          $("#entrada-error").textContent = "No se ha podido preparar la entrada con Google. Usa la clave larga.";
        });
    };
    var script = document.createElement("script");
    script.src = "https://accounts.google.com/gsi/client";
    script.async = true;
    script.onload = pintar;
    script.onerror = function () {
      $("#entrada-error").textContent = "Google no responde. Usa la clave larga.";
    };
    document.head.appendChild(script);
  }

  // Compartir desde el móvil: iOS abre la app con ?texto=... y eso entra
  // directo en la bandeja, sin que haya que teclear nada.
  function compartido() {
    var p = new URLSearchParams(location.search);
    var texto = [p.get("titulo"), p.get("texto"), p.get("url")].filter(Boolean).join(" ").trim();
    if (!texto) return;
    history.replaceState(null, "", location.pathname);
    guardar("capturar", { texto: texto, via: "pwa" }).then(function () {
      avisar("Guardado en la bandeja.");
      cargar();
    });
  }

  // ---------- arranque ----------
  fijarLuz(localStorage.getItem("cdp_luz") || "interior");
  if (clave()) entrar(clave());
  else mostrarEntrada();

  // Al volver a la app tras un rato, lo que hay en pantalla puede ser viejo:
  // otra sesión de Claude o el bot han podido escribir mientras tanto.
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && !$("#app").hidden) cargar().catch(function () {});
  });
})();
</script>
</body>
</html>
